<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Samora Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Brand token system — same roles as marketing/brand/samora-tokens.css.
     Legacy variable names are kept as aliases below so existing markup
     inherits the new system without being rewritten. */
  --c-canvas:#0F0E0B; --c-surface:#16150F; --c-surface-2:#1D1B14;
  --c-line:#2C2A22; --c-line-2:#3A3830;
  --c-ink:#EDE9DE; --c-ink-2:#B4B0A4; --c-ink-3:#7A7668;
  --c-accent:#C49A2A; --c-accent-solid:#A07824;
  --c-pos:#4A8C5C; --c-neg:#C0523F; --c-warn:#C07820; --c-info:#3A6EA8;
  --r-sm:2px; --r-md:3px; --r-round:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --font:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,'Fira Code',monospace;
  --ease:cubic-bezier(0.2,0,0,1);

  /* back-compat aliases */
  --bg:var(--c-canvas); --bg2:var(--c-surface); --bg3:var(--c-surface-2);
  --surface:var(--c-surface-2); --surface2:var(--c-line);
  --border:var(--c-line); --border2:var(--c-line-2);
  --text:var(--c-ink); --text2:var(--c-ink-2); --text3:var(--c-ink-3);
  --gold:var(--c-accent); --gold2:var(--c-accent-solid);
  --green:var(--c-pos); --coral:var(--c-neg); --amber:var(--c-warn); --blue:var(--c-info);
  --sans:var(--font); --r:var(--r-sm); --r2:var(--r-md);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:var(--font)}

#auth{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:var(--s-4)}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--s-6);width:340px}
.auth-card h2{font-size:15px;font-weight:500;margin-bottom:var(--s-5);color:var(--gold)}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;color:var(--text3);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;color:var(--text);font-size:14px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold2)}
.btn{width:100%;padding:10px;background:var(--gold2);border:none;border-radius:var(--r-sm);color:#18160F;font-size:14px;font-weight:600;cursor:pointer;transition:background 120ms var(--ease)}
.btn:hover{background:var(--gold)}
.btn:disabled{opacity:0.5;cursor:default}
.btn-sm{width:auto;padding:6px 14px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover{border-color:var(--gold2);color:var(--text)}
.btn-danger{background:var(--coral);color:white}
.msg{font-size:12px;color:var(--coral);margin-top:var(--s-2);text-align:center}
.msg.ok{color:var(--green)}

#app{display:none;flex:1;flex-direction:column}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:var(--s-3) var(--s-5);display:flex;align-items:center;justify-content:space-between}
.topbar-brand{font-size:16px;font-weight:600;color:var(--gold);letter-spacing:0.01em}
.topbar-right{display:flex;align-items:center;gap:var(--s-3)}
.topbar-email{font-size:12px;color:var(--text3)}
.logout{background:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 12px;color:var(--text3);cursor:pointer;font-size:12px}
.logout:hover{color:var(--text);border-color:var(--border2)}

.layout{display:flex;flex:1;min-height:0}
.sidebar{width:232px;background:var(--bg2);border-right:1px solid var(--border);padding:var(--s-4) 0;flex-shrink:0;overflow-y:auto}
.sb-section{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;padding:var(--s-3) var(--s-4) var(--s-1)}
.sb-item{padding:8px var(--s-4);font-size:13px;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:var(--s-2);border-left:2px solid transparent}
.sb-item:hover{color:var(--text);background:var(--surface)}
.sb-item.active{color:var(--gold);background:var(--surface);border-left-color:var(--gold)}
.dot{width:6px;height:6px;border-radius:var(--r-round);background:var(--green);flex-shrink:0}

/* Section nav — the decluttering mechanism. One area on screen at a time. */
.secnav{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:var(--s-5);overflow-x:auto}
.secnav-item{padding:8px 14px;font-size:13px;color:var(--text3);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;transition:color 120ms var(--ease)}
.secnav-item:hover{color:var(--text2)}
.secnav-item.active{color:var(--gold);border-bottom-color:var(--gold)}
.section{display:none}
.section.active{display:block}

.main{flex:1;padding:var(--s-5);overflow-y:auto;max-width:1120px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-4);margin-bottom:14px}
.card-title{font-size:14px;font-weight:500;margin-bottom:var(--s-3);display:flex;align-items:center;justify-content:space-between}
.card-sub{font-size:11px;color:var(--text3);margin-bottom:var(--s-3);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s-3)}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-label{font-size:13px;color:var(--text)}
.row-sub{font-size:11px;color:var(--text3)}
.sel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;font-size:12px;color:var(--text)}
.key-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 8px;color:var(--text3);font-family:var(--mono);font-size:11px}
.key-input:focus{outline:none;border-color:var(--gold2);color:var(--text)}
.num{width:52px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 8px;color:var(--text);font-size:13px;text-align:center}
.str{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;color:var(--text);font-size:12px;width:120px}
.toggle{width:32px;height:18px;border-radius:var(--r-round);cursor:pointer;position:relative;transition:background 120ms var(--ease);flex-shrink:0;border:none}
.toggle.on{background:var(--gold2)}.toggle.off{background:var(--border2)}
.toggle-dot{position:absolute;top:2px;width:14px;height:14px;border-radius:var(--r-round);background:white;transition:left 120ms var(--ease);pointer-events:none}
.toggle.on .toggle-dot{left:16px}.toggle.off .toggle-dot{left:2px}
.pill{font-size:10px;padding:2px 8px;border-radius:var(--r-sm);font-weight:500;display:inline-block}
.pill-green{background:rgba(74,140,92,0.16);color:#6DB88A}
.pill-amber{background:rgba(192,120,32,0.16);color:var(--amber)}
.pill-gray{background:rgba(122,118,104,0.16);color:var(--text3)}
.pill-blue{background:rgba(58,110,168,0.16);color:#6BA4DA}
.stage-row{display:flex;align-items:center;gap:var(--s-2);background:var(--surface);border-radius:var(--r-sm);padding:6px 10px;margin-bottom:6px}
.stage-num{font-size:11px;color:var(--text3);width:16px}
.stage-input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;outline:none}
.stage-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px}
.stage-del:hover{color:var(--coral)}
.user-row{display:flex;align-items:center;gap:var(--s-3);padding:8px 12px;background:var(--bg3);border-radius:var(--r-sm);margin-bottom:6px}
.user-avatar{width:32px;height:32px;border-radius:var(--r-round);background:var(--gold2);color:#18160F;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:500}
.user-email{font-size:11px;color:var(--text3)}
/* A removed person stays listed but visibly inert, so the org's history
   is still legible without them looking like an active seat. */
.user-row.is-removed{opacity:.55}
/* Archived people are history, not seats: folded away under one line so the
   team list shows who is actually on the team. */
.archived-wrap{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.archived-wrap summary{cursor:pointer;font-size:12px;color:var(--text3);padding:4px 0;list-style:none}
.archived-wrap summary::-webkit-details-marker{display:none}
.archived-wrap summary:before{content:'\25B8  '}
.archived-wrap[open] summary:before{content:'\25BE  '}
.ap-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.us-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.us-tile{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;background:var(--bg3)}
.us-tile .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.us-tile .v{font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.us-tile .d{font-size:11px;color:var(--text3);margin-top:2px}
.us-wrap{overflow-x:auto}
.ap-table td.n,.ap-table th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.us-bar{display:inline-block;width:60px;height:6px;background:var(--border);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.us-bar i{display:block;height:100%;background:var(--gold2)}
.ap-table th{text-align:left;color:var(--text3);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border)}
.ap-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.ap-ok{color:var(--green)}.ap-warn{color:var(--amber,#d4a017)}.ap-err{color:var(--coral)}
.ap-pass{font-family:Menlo,Consolas,monospace;font-size:12px;background:var(--bg3);padding:1px 6px;border-radius:2px}
.modal.wide{width:720px}
.btn-remove:hover{border-color:var(--coral);color:var(--coral)}
.user-role{font-size:10px;padding:2px 8px;border-radius:var(--r-sm);background:var(--surface);color:var(--text2);border:1px solid var(--border)}

/* Per-section save bar. Sticky, and it states its own scope so it is never
   ambiguous which cards a given button covers. */
.save-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) 0;margin-top:var(--s-4);background:var(--bg);border-top:1px solid var(--border);flex-wrap:wrap}
.save-scope{font-size:11px;color:var(--text3)}
.save-status{font-size:12px;color:var(--text3)}
.save-status.ok{color:var(--green)}.save-status.err{color:var(--coral)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--s-5);width:440px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:var(--s-4);color:var(--gold)}
.acct-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--surface);border-radius:var(--r-sm);font-size:12px;color:var(--text2);margin:2px}
.acct-chip .x{cursor:pointer;color:var(--text3);font-size:14px}
.acct-chip .x:hover{color:var(--coral)}
.empty{font-size:12px;color:var(--text3);font-style:italic;padding:20px 0;text-align:center}
/* ── Team & access console (2026-10-02). Scoped under .sxa, colours from the
   host app's own tokens so it sits natively in SamoraOS and the admin panel. */
.sxa{font-family:var(--sans,inherit);color:var(--text,#1c1a14);position:relative}
.sxa *{box-sizing:border-box}
.sxa-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sxa-head-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sxa-title{font-size:16px;font-weight:600;letter-spacing:.01em}
.sxa-sub{font-size:12.5px;color:var(--text3,#7a7668);margin-top:3px;line-height:1.5;max-width:560px}
.sxa-sub-tight{margin:0 0 8px}
.sxa-chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border2,#d8d3c4);color:var(--text2,#4a473e);white-space:nowrap}
.sxa-chip-warn{border-color:var(--amber,#c07820);color:var(--amber,#c07820)}
.sxa-btn{font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:3px;border:1px solid var(--border2,#d8d3c4);background:transparent;color:var(--text,#1c1a14);cursor:pointer;white-space:nowrap}
.sxa-btn:disabled{opacity:.45;cursor:not-allowed}
.sxa-btn:focus-visible,.sxa-sel:focus-visible,.sxa-in:focus-visible,.sxa-tab:focus-visible,.sxa-sw:focus-visible{outline:2px solid var(--gold,#c49a2a);outline-offset:1px}
.sxa-btn-gold{background:var(--gold,#c49a2a);border-color:var(--gold,#c49a2a);color:#18160F}
.sxa-btn-ghost{color:var(--text2,#4a473e)}
.sxa-btn-ghost:hover{border-color:var(--text3,#7a7668)}
.sxa-btn-bad{background:var(--coral,#c0523f);border-color:var(--coral,#c0523f);color:#fff}
.sxa-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border,#e6e1d4);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.sxa-tabs::-webkit-scrollbar{display:none}
.sxa-tab{font:inherit;font-size:13px;font-weight:500;padding:9px 12px;border:0;background:none;color:var(--text3,#7a7668);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.sxa-tab.on{color:var(--text,#1c1a14);border-bottom-color:var(--gold,#c49a2a)}
.sxa-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sxa-in,.sxa-sel{font:inherit;font-size:13px;color:var(--text,#1c1a14);background:var(--surface2,#f6f4ef);border:1px solid var(--border2,#d8d3c4);border-radius:3px;padding:7px 9px;min-width:0}
.sxa-tools .sxa-in{flex:0 1 240px}
.sxa-sel{max-width:100%}
.sxa-sel-s{font-size:12px;padding:5px 7px;max-width:190px}
.sxa-note{font-size:12px;color:var(--text3,#7a7668);line-height:1.5}
.sxa-note-block{background:var(--surface2,#f6f4ef);border:1px solid var(--border,#e6e1d4);border-radius:3px;padding:9px 11px;margin-bottom:12px}
.sxa-list{border:1px solid var(--border,#e6e1d4);border-radius:3px}
.sxa-row{display:grid;grid-template-columns:minmax(180px,1.6fr) minmax(120px,.9fr) minmax(150px,1.2fr) 64px 84px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border,#e6e1d4)}
.sxa-row:last-child{border-bottom:0}
.sxa-row-gone{grid-template-columns:1fr auto;opacity:.75}
.sxa-person{display:flex;align-items:center;gap:10px;min-width:0}
.sxa-av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface2,#f6f4ef);border:1px solid var(--border2,#d8d3c4);color:var(--text2,#4a473e)}
.sxa-av-s{width:24px;height:24px;font-size:10px}
.sxa-pw{min-width:0}
.sxa-pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sxa-pe{font-size:11.5px;color:var(--text3,#7a7668);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sxa-you{font-size:10px;font-weight:700;color:var(--gold,#c49a2a);text-transform:uppercase;letter-spacing:.05em;margin-left:4px}
.sxa-badge{font-size:10px;font-weight:700;color:var(--gold,#c49a2a);border:1px solid var(--gold,#c49a2a);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
.sxa-cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.sxa-cell-sw{align-items:flex-start}
.sxa-cell-act{align-items:flex-end}
.sxa-lbl{font-size:10.5px;font-weight:600;color:var(--text3,#7a7668);text-transform:uppercase;letter-spacing:.06em}
.sxa-list .sxa-row .sxa-lbl{display:none}
.sxa-static{font-size:13px;color:var(--text2,#4a473e);padding:7px 0}
.sxa-sw{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:var(--border2,#d8d3c4);position:relative;cursor:pointer;transition:background .15s;margin:6px 0 0}
.sxa-sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sxa-sw:checked{background:var(--gold,#c49a2a)}
.sxa-sw:checked::after{left:18px}
.sxa-sw:disabled{opacity:.5;cursor:not-allowed}
.sxa-gone{margin-top:12px;font-size:12.5px;color:var(--text3,#7a7668)}
.sxa-gone summary{cursor:pointer;padding:6px 0}
.sxa-empty{font-size:13px;color:var(--text3,#7a7668);padding:22px 8px;text-align:center}
.sxa-empty-s{padding:10px 0;text-align:left}
.sxa-err{color:var(--coral,#c0523f)}
.sxa-sec{font-size:11px;font-weight:700;color:var(--text3,#7a7668);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}
.sxa-ul{list-style:none;margin:0;padding:0 0 0 22px;border-left:1px dashed var(--border2,#d8d3c4)}
.sxa-ul-root{padding-left:0;border-left:0}
.sxa-node{margin:6px 0}
.sxa-card{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border,#e6e1d4);border-radius:3px;background:var(--surface,transparent)}
.sxa-card-warn{border-color:var(--amber,#c07820)}
.sxa-card .sxa-pw{flex:1}
.sxa-tw{width:18px;flex:0 0 18px;border:0;background:none;color:var(--text3,#7a7668);cursor:pointer;font-size:12px;padding:0}
.sxa-tw-x{display:inline-block}
.sxa-acc-pick{display:flex;flex-direction:column;gap:5px;max-width:420px;margin-bottom:6px}
.sxa-acc-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sxa-acc-ul{list-style:none;margin:0;padding:0;border:1px solid var(--border,#e6e1d4);border-radius:3px}
.sxa-acc-ul li{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--border,#e6e1d4);font-size:13px}
.sxa-acc-ul li:last-child{border-bottom:0}
.sxa-li-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sxa-muted{color:var(--text3,#7a7668);font-weight:400}
.sxa-why{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--border2,#d8d3c4);color:var(--text2,#4a473e);white-space:nowrap}
.sxa-why-org{border-color:var(--gold,#c49a2a);color:var(--gold,#c49a2a)}
.sxa-why-team{border-color:var(--green,#4a8c5c);color:var(--green,#4a8c5c)}
.sxa-why-shared,.sxa-why-shared_team{border-color:var(--blue,#3a6ea8);color:var(--blue,#3a6ea8)}
.sxa-share{margin-top:18px;padding-top:4px;border-top:1px solid var(--border,#e6e1d4)}
.sxa-share-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
.sxa-share-row .sxa-sel{max-width:220px}
.sxa-inl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2,#4a473e);cursor:pointer}
.sxa-shares{margin-top:6px}
.sxa-log{list-style:none;margin:0;padding:0}
.sxa-log li{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--border,#e6e1d4);font-size:13px;line-height:1.45}
.sxa-when{font-size:11.5px;color:var(--text3,#7a7668);padding-top:1px}
.sxa-toast{font-family:var(--sans,inherit);position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--text,#1c1a14);color:var(--bg,#fff);font-size:13px;padding:9px 16px;border-radius:3px;transition:opacity .18s,transform .18s;z-index:10001;max-width:90vw}
.sxa-toast.show{opacity:1;transform:translate(-50%,0)}
.sxa-toast.bad{background:var(--coral,#c0523f);color:#fff}
.sxa-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10000;padding:16px}
.sxa-modal{background:var(--bg2,var(--surface,#fff));border:1px solid var(--border2,#d8d3c4);border-radius:4px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.sxa-f{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.sxa-f .sxa-in,.sxa-f .sxa-sel{width:100%}
.sxa-f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sxa-msg{font-size:12.5px;margin-top:10px;min-height:1px}
.sxa-msg.bad{color:var(--coral,#c0523f)}
.sxa-code{font-family:var(--mono,ui-monospace,monospace);font-size:15px;letter-spacing:.04em;padding:10px 12px;margin-top:10px;border:1px dashed var(--gold,#c49a2a);border-radius:3px;user-select:all}
.sxa-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media (max-width:720px){
  .sxa-row{grid-template-columns:1fr 1fr;row-gap:8px}
  .sxa-row>.sxa-person{grid-column:1/-1}
  .sxa-list .sxa-row .sxa-lbl{display:block}
  .sxa-row-gone{grid-template-columns:1fr auto}
  .sxa-row-gone>.sxa-person{grid-column:auto}
  .sxa-cell-act{align-items:flex-start;justify-content:flex-end}
  .sxa-acc-cols{grid-template-columns:1fr}
  .sxa-f2{grid-template-columns:1fr}
  .sxa-sel-s{max-width:130px}
  .sxa-log li{grid-template-columns:1fr;gap:2px}
  .sxa-ul{padding-left:12px}
}
.sxa-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--border2,#d8d3c4);border-radius:3px;background:var(--surface2,#f6f4ef);min-height:38px}
.sxa-chips:focus-within{outline:2px solid var(--gold,#c49a2a);outline-offset:1px}
.sxa-chipv{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:3px 4px 3px 9px;border-radius:999px;background:var(--surface,#fff);border:1px solid var(--border2,#d8d3c4);color:var(--text,#1c1a14)}
.sxa-chipv button{border:0;background:none;cursor:pointer;color:var(--text3,#7a7668);font-size:14px;line-height:1;padding:0 4px}
.sxa-chipv button:hover{color:var(--coral,#c0523f)}
.sxa-chip-in{flex:1;min-width:160px;border:0;background:transparent;font:inherit;font-size:13px;color:var(--text,#1c1a14);padding:4px;outline:none}
.sxa-pf textarea.sxa-in{width:100%;resize:vertical}
.sxa-prod{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--border,#e6e1d4)}
.sxa-prod:last-child{border-bottom:0}
.sxa-prod-act{display:flex;gap:6px;flex:0 0 auto}
.sxa-wrap{white-space:normal}
.sxa-kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.sxa-kw span{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface2,#f6f4ef);color:var(--text2,#4a473e)}
[data-sxa-hosted] .admin-title{display:none}
[data-sxa-hosted]>.admin-card{border:0;padding:0;background:none}
@media (max-width:720px){.sxa-prod{flex-direction:column}.sxa-chip-in{min-width:120px}}
@media (prefers-reduced-motion:reduce){.sxa-sw,.sxa-sw::after,.sxa-toast{transition:none}}
</style>
</head>
<body>

<div id="auth">
  <div style="font-size:20px;font-weight:600;color:var(--gold)">Samora Admin</div>
  <div class="auth-card">
    <h2>Sign in</h2>
    <div class="f"><label>Email</label><input id="aEmail" type="email" autocomplete="username"/></div>
    <div class="f"><label>Password</label><input id="aPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"/></div>
    <button class="btn" onclick="login()">Sign in</button>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-brand">Samora Admin</div>
    <div class="topbar-right">
      <span class="topbar-email" id="adminEmail"></span>
      <button class="logout" onclick="doLogout()">Sign out</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="sb-section">Clients</div>
      <div id="sidebar-clients"></div>
      <div style="padding:8px 16px"><button class="btn btn-sm" onclick="showNewOrgModal()" style="width:100%">+ New client</button></div>
      <div style="padding:0 16px 8px"><button class="btn btn-sm btn-outline" onclick="showAccessRequests()" style="width:100%" id="sb-requests">Access requests</button></div>
    </div>
    <div class="main" id="main-area">
      <div class="empty">Select a client from the sidebar or create a new one</div>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<!-- SheetJS reads the uploaded file. ExcelJS writes the download, because the
     community build of SheetJS cannot write cell styling or data validation
     (both are paid-tier features there) and the template needs a real Role
     dropdown and coloured headers. Read and write therefore use different
     libraries on purpose. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
// FEATURE FLAGS, declared ONCE and used by both the renderer and the save.
//
// They used to be a hardcoded array in two places, and the two had drifted:
// `deal_signals` shipped in the edge function's defaults and `discovery_mode`
// gates discover_accounts and commit_discovery, but NEITHER was rendered here.
//
// That was not merely a missing toggle. saveConfig rebuilt `features` from the
// rendered list and sent the whole object, so any flag this panel did not know
// about was WIPED the next time anyone pressed Save on the Company tab. A
// platform admin turning discovery_mode on in SQL would have lost it the first
// time someone edited an unrelated setting.
const FEATURE_FLAGS = ['sam_intelligence','account_coverage','intent_vs_reality',
                       'account_intel_ai','digest_reports','deal_signals','discovery_mode'];
const FEATURE_LABELS = {
  sam_intelligence:  'SAM Intelligence',
  account_coverage:  'Coverage tracking',
  intent_vs_reality: 'Intent vs Reality',
  account_intel_ai:  'AI Intel (Gemini)',
  digest_reports:    'Digest reports',
  deal_signals:      'Deal signals',
  discovery_mode:    'Discovery Mode (AI company finder)'
};
</script>
<script>
const SB_URL = localStorage.getItem('samora-admin-sb-url') || 'https://gowpuicpmrwsohongosf.supabase.co';
const SB_ANON = localStorage.getItem('samora-admin-sb-anon') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdvd3B1aWNwbXJ3c29ob25nb3NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzOTExMDgsImV4cCI6MjA5NTk2NzEwOH0.35CjODxyxOjAKp-xBOBx4oAXO_qjLyVttVaJEhp7YEg';
const EDGE = SB_URL + '/functions/v1/sam-gmail-signals';
let me = null, orgs = [], activeOrg = null;

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function $(id){return document.getElementById(id)}

// ── Auth ──
async function login(){
  const email=$('aEmail').value.trim(), pass=$('aPass').value;
  if(!email||!pass){$('authMsg').textContent='Enter email and password';return}
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(!d.access_token){$('authMsg').textContent=d.error_description||'Invalid credentials';return}
    me={id:d.user.id,email:d.user.email,token:d.access_token};
    const ck=await fetch(SB_URL+'/rest/v1/samora_admins?user_id=eq.'+me.id+'&select=id&limit=1',{headers:{'apikey':SB_ANON,'Authorization':'Bearer '+me.token}});
    const ckr=await ck.json();
    if(!Array.isArray(ckr)||!ckr.length){me=null;$('authMsg').textContent='Not a Samora admin';return}
    $('adminEmail').textContent=me.email;
    $('auth').style.display='none';$('app').style.display='flex';
    loadOrgs();
  }catch(e){$('authMsg').textContent='Error: '+e.message}
}
function doLogout(){me=null;orgs=[];activeOrg=null;$('app').style.display='none';$('auth').style.display='flex'}

async function edgeCall(action,payload){
  const r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+me.token,'apikey':SB_ANON},body:JSON.stringify(Object.assign({action},payload||{}))});
  return await r.json();
}

// ── Load orgs ──
async function loadOrgs(){
  const d=await edgeCall('admin_list_orgs');
  orgs=d.orgs||[];
  renderSidebar();
  if(activeOrg)selectOrg(activeOrg);
}
function renderSidebar(){
  $('sidebar-clients').innerHTML=orgs.length?orgs.map(o=>'<div class="sb-item'+(activeOrg===o.org_id?' active':'')+'" onclick="selectOrg(\''+o.org_id+'\')"><div class="dot"></div>'+esc(o.display_name||o.name)+'</div>').join(''):'<div style="padding:8px 16px;font-size:12px;color:var(--text3)">No clients yet</div>';
}

// ── Section routing ────────────────────────────────────────────────────────
// The decluttering change: 11 cards used to compete on one scroll. They are
// now grouped by the job an admin arrived to do, not by which table the data
// happens to live in, and only one group is on screen at a time.
const ADMIN_SECTIONS = [
  { key:'people',       label:'People' },
  { key:'company',      label:'Company' },
  { key:'scoring',      label:'Scoring' },
  { key:'alerts',       label:'Alerts' },
  { key:'integrations', label:'Integrations' },
  { key:'bulk',         label:'Bulk setup' },
  { key:'usage',        label:'Usage' }
];
let _activeSection = 'people';

function renderSecNav(){
  return '<div class="secnav">' + ADMIN_SECTIONS.map(function(s){
    return '<button class="secnav-item'+(s.key===_activeSection?' active':'')+'" data-sec="'+s.key+'" onclick="showSection(\''+s.key+'\')">'+s.label+'</button>';
  }).join('') + '</div>';
}
function showSection(key){
  _activeSection = key;
  document.querySelectorAll('.secnav-item').forEach(function(b){ b.classList.toggle('active', b.dataset.sec===key); });
  document.querySelectorAll('.section').forEach(function(el){ el.classList.toggle('active', el.id==='sec-'+key); });
  try{ localStorage.setItem('samora-admin-section', key); }catch(_e){}
}
function restoreSection(){
  let k='people';
  try{ k=localStorage.getItem('samora-admin-section')||'people'; }catch(_e){}
  if(!ADMIN_SECTIONS.some(function(s){return s.key===k;})) k='people';
  showSection(k);
}
// Section-scoped save bar. Naming the scope is the point: previously two save
// bars sat mid-page governing different subsets with nothing saying which.
function saveBar(scopeLabel, fnCall, statusId){
  return '<div class="save-bar">'+
    '<button class="btn btn-sm" onclick="'+fnCall+'">Save '+scopeLabel+'</button>'+
    '<span class="save-scope">Applies to '+scopeLabel+' only</span>'+
    '<span class="save-status" id="'+statusId+'"></span>'+
  '</div>';
}
// saveConfig and saveOrgPolicy each write to a single status element. With
// several bars on the page, update all of them rather than leaving the
// visible one silent. Blunt, but never wrong about whether a save happened.
function setSaveStatus(text, cls){
  document.querySelectorAll('.save-status').forEach(function(el){
    el.textContent=text; el.className='save-status'+(cls?' '+cls:'');
  });
}

// ── Select org ──
async function selectOrg(orgId){
  activeOrg=orgId;renderSidebar();
  const org=orgs.find(o=>o.org_id===orgId);
  if(!org){$('main-area').innerHTML='<div class="empty">Org not found</div>';return}
  const [users, productsData, kvData] = await Promise.all([
    edgeCall('admin_list_users',{org_id:orgId}),
    edgeCall('get_products',{org_id:orgId}),
    edgeCall('admin_get_org_settings',{org_id:orgId, keys:['health_score_weights','notification_rules','enrichment_apollo_key','enrichment_lusha_key','enrichment_hunter_key','stakeholder_scout_profile','scout_batch_size','campaign_goal_templates','seat_limit']})
  ]);
  renderOrgPage(org, users.users||[], productsData.products||[], (kvData&&kvData.settings)||{});
}

function renderOrgPage(org, users, products=[], kv={}){
  // Kept so the remove modal can offer the other active members as
  // inheritors without a second fetch.
  window._lastUsers = users || [];
  const s=org.settings||{};
  const stages=s.deal_stages||[{key:'prospective',label:'Prospective'},{key:'value_prop',label:'Value Prop'},{key:'commercial',label:'Commercial'}];
  const features=s.features||{};
  window.__orgFeatures = features;   // kept so saveConfig can merge, not replace
  const roles=s.role_labels||{};
  const icp=s.icp_definition||{};
  _kvCache = kv || {};

  $('main-area').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <div>
        <div style="font-size:18px;font-weight:500">${esc(org.display_name||org.name)}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">org_id: ${esc(org.org_id)} · ${users.length} users</div>
      </div>
      <span class="pill pill-green">Active</span>
    </div>

    ${renderSecNav()}

    <!-- ══ PEOPLE ══ -->
    <div class="section" id="sec-people">
      <div class="card">
        <div class="card-title">Team <button class="btn btn-sm btn-outline" onclick="showAddPeopleModal('${org.org_id}')">+ Add people</button></div>
        <div class="card-sub">Everyone with access to this organisation. New people get a welcome email from Sam with their login and a temporary password they must change on first sign-in. Assign accounts to control what each rep sees.</div>
        <div id="user-list">
          ${(function(){
            const act = users.filter(u => u.is_active !== false);
            const arch = users.filter(u => u.is_active === false);
            const fmt = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : null;
            const row = (u) => `<div class="user-row${u.is_active===false?' is-removed':''}">
              <div class="user-avatar">${esc((u.name||u.email||'?').slice(0,2).toUpperCase())}</div>
              <div class="user-info">
                <div class="user-name">${esc(u.name||u.email)}</div>
                <div class="user-email">${esc(u.email)} · ${u.account_count||0} accounts${u.is_active===false
                  ? (u.deactivated_at ? ' · archived ' + esc(fmt(u.deactivated_at)) : '')
                  : ((u.active_since||u.created_at) ? ' · active since ' + esc(fmt(u.active_since||u.created_at)) : '')}</div>
              </div>
              <span class="user-role">${esc(u.role||'member')}</span>
              ${u.is_active===false
                ? `<button class="btn btn-sm btn-outline" onclick="reactivateUser('${org.org_id}','${u.user_id}','${esc(u.name||u.email)}')">Restore</button>`
                : `<button class="btn btn-sm btn-outline" onclick="showAssignAccountsModal('${org.org_id}','${u.user_id}','${esc(u.name||u.email)}')">Assign accounts</button>
                   <button class="btn btn-sm btn-outline btn-remove" onclick="showRemoveUserModal('${org.org_id}','${u.user_id}','${esc(u.name||u.email)}',${u.account_count||0})" title="Archive: revoke access, keep their history">Remove</button>`}
            </div>`;
            if (!users.length) return '<div class="empty">No users yet. Add people to get started, or upload a list from Bulk setup.</div>';
            return (act.length ? act.map(row).join('') : '<div class="empty">No active people. Restore someone below, or add people.</div>') +
              (arch.length ? `<details class="archived-wrap"><summary>Archived (${arch.length}): removed people, kept for history</summary>${arch.map(row).join('')}</details>` : '');
          })()}
        </div>
      </div>
      <div class="card">
        <div class="card-title">Seats</div>
        <div class="card-sub">The most people this client's own admin can have active at once. Their admin cannot add or restore anyone past it. You can, and it is logged as a Samora override. Leave empty for no cap.</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <input type="number" id="seat-limit" min="0" value="${esc(String(kv.seat_limit || ''))}" placeholder="No cap" style="width:90px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:var(--sans);font-size:13px">
          <span style="font-size:12px;color:var(--text3)">active people</span>
          <button class="btn btn-sm btn-outline" onclick="saveSeatLimit('${org.org_id}')">Save</button>
          <span id="seat-limit-msg" style="font-size:12px;color:var(--text3)"></span>
        </div>
      </div>
      <div class="card">
        <div class="card-sub" style="margin-bottom:12px">Exactly what this client's admin sees under Admin in SamoraOS, with your Samora rights on top: you can act on any org, go past the seat cap, and change an account owner. Every change here is logged against Samora.</div>
        <div id="sxa-admin-mount"><div class="empty">Loading</div></div>
      </div>
      <div class="card">
        <div class="card-title">Role labels</div>
        <div class="card-sub">What each tier is called in this organisation. Changes the wording only, not permissions.</div>
        ${['sdr','ae','manager','director'].map(r=>`<div class="row"><div class="row-label">${r}</div><input class="str" id="cfg-role-${r}" value="${esc(roles[r]||r.toUpperCase())}" oninput="markDirty()"/></div>`).join('')}
      </div>
      ${saveBar('role labels', "saveConfig('"+org.org_id+"')", 'save-status')}
    </div>

    <!-- ══ COMPANY ══ -->
    <div class="section" id="sec-company">
      <div class="card">
        <div class="card-title">ICP Definition</div>
        <div class="card-sub">Define your Ideal Customer Profile. Samora scores every account against this, and the ICP badge on pipeline cards guides prioritisation.</div>
        <div style="margin-top:10px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:3px">Target industries (comma-separated)</div>
          <input class="str" id="icp-industries" style="width:100%" value="${esc((icp.target_industries||[]).join(', '))}" placeholder="FMCG, CPG, Food &amp; Beverage, Personal Care" oninput="markDirty()"/>
        </div>
        <div style="margin-top:8px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:3px">Target geographies (comma-separated)</div>
          <input class="str" id="icp-geos" style="width:100%" value="${esc((icp.target_geographies||[]).join(', '))}" placeholder="India, Middle East, Southeast Asia" oninput="markDirty()"/>
        </div>
        <div style="margin-top:8px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:3px">Target stakeholder titles (comma-separated)</div>
          <input class="str" id="icp-stakeholders" style="width:100%" value="${esc((icp.target_stakeholders||[]).join(', '))}" placeholder="VP Sales, Commercial Director, CTO, CMO" oninput="markDirty()"/>
        </div>
        <div class="grid2" style="margin-top:8px">
          <div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:3px">Target company size</div>
            <input class="str" id="icp-size" style="width:100%" value="${esc(icp.target_company_size||'')}" placeholder="e.g. 500-50,000 employees" oninput="markDirty()"/>
          </div>
          <div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:3px">Ideal deal size (USD)</div>
            <input class="str" id="icp-deal-size" style="width:100%" type="number" value="${icp.ideal_deal_size_usd||''}" placeholder="e.g. 50000" oninput="markDirty()"/>
          </div>
        </div>
        <div style="margin-top:8px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:3px">Ideal use case</div>
          <textarea class="str" id="icp-use-case" rows="2" placeholder="Field sales execution and retail visibility for enterprise FMCG brands…" oninput="markDirty()" style="width:100%;resize:vertical;height:52px">${esc(icp.ideal_use_case||'')}</textarea>
        </div>
        <div style="margin-top:8px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:3px">Additional keywords (comma-separated)</div>
          <input class="str" id="icp-keywords" style="width:100%" value="${esc((icp.keywords||[]).join(', '))}" placeholder="retail execution, field force, outlet coverage" oninput="markDirty()"/>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Product catalog <button class="btn btn-sm btn-outline" onclick="showAddProductModal('${org.org_id}')">+ Add product</button></div>
        <div class="card-sub">What this org sells. Reps pick a product when logging opportunities. Keywords help map conversation signals to the right product.</div>
        <div style="margin-top:10px">
          ${products.length ? products.map(p => `<div style="background:var(--bg3);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:500;color:var(--text)">${esc(p.name)}${p.category?` <span style="font-size:10px;color:var(--text3);background:var(--surface);border-radius:var(--r-sm);padding:1px 6px;margin-left:4px">${esc(p.category)}</span>`:''}</div>
              ${p.description?`<div style="font-size:11px;color:var(--text3);margin-top:2px">${esc(p.description)}</div>`:''}
              ${p.keywords&&p.keywords.length?`<div style="font-size:10px;color:var(--text3);margin-top:4px">Keywords: ${p.keywords.map(k=>`<span style="background:var(--surface2);border-radius:var(--r-sm);padding:1px 5px;margin-right:3px">${esc(k)}</span>`).join('')}</div>`:''}
            </div>
            <button onclick="deleteProduct('${p.id}','${org.org_id}')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1">×</button>
          </div>`).join('') : '<div style="font-size:12px;color:var(--text3);font-style:italic">No products yet.</div>'}

// ── Usage: seat days (billing basis) and used days (adoption) ──────────────
function usageMonthOptions(){
  const out = [], d = new Date();
  for (let k = 0; k < 13; k++){
    const x = new Date(d.getFullYear(), d.getMonth() - k, 1);
    const v = x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0');
    out.push('<option value="' + v + '">' + x.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }) + (k === 0 ? ' (so far)' : '') + '</option>');
  }
  return out.join('');
}
let _usage = null;
async function loadUsage(orgId){
  const body = $('us-body'); if (!body) return;
  const month = ($('us-month') || {}).value;
  body.innerHTML = '<div class="empty">Loading usage</div>';
  let d;
  try { d = await edgeCall('admin_usage', { org_id: orgId, month: month }); }
  catch (e) { body.innerHTML = '<div class="msg">' + esc(e.message || String(e)) + '</div>'; return; }
  if (!d || !d.ok){ body.innerHTML = '<div class="msg">' + esc((d && d.error) || 'Could not load usage. Is the usage_metering SQL run and the edge function deployed?') + '</div>'; return; }
  _usage = d.usage; _usage._org = (orgs.find(o => o.org_id === orgId) || {}).display_name || orgId;
  const u = d.usage, dim = u.days_in_month, rows = u.users || [];
  const seatDays = rows.reduce((a, r) => a + r.seat_days, 0), usedDays = rows.reduce((a, r) => a + Math.min(r.used_days, r.seat_days || r.used_days), 0);
  const seatMonths = seatDays / dim;
  const through = new Date(u.counted_through + 'T00:00:00').getDate();
  const fmtD = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : 'now';
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  body.innerHTML =
    '<div class="us-tiles">' +
      '<div class="us-tile"><div class="k">Seats, in user months</div><div class="v">' + seatMonths.toFixed(2) + '</div><div class="d">' + seatDays + ' seat days of ' + dim + ' day month</div></div>' +
      '<div class="us-tile"><div class="k">People with a seat</div><div class="v">' + rows.filter(r => r.seat_days > 0).length + '</div><div class="d">at any point in the month</div></div>' +
      '<div class="us-tile"><div class="k">Adoption</div><div class="v">' + pct(usedDays, seatDays) + '%</div><div class="d">used days over seat days' + (through < dim ? ', to day ' + through : '') + '</div></div>' +
      '<div class="us-tile"><div class="k">Sharing with billing</div><div class="v" style="font-size:14px">' + (d.sharing_on ? 'On' : 'Off') + '</div><div class="d">' + (d.sharing_on ? 'The billing app can pull this' : 'Set BILLING_USAGE_KEY to turn it on') + '</div></div>' +
    '</div>' +
    (rows.length ? '<div class="us-wrap"><table class="ap-table"><tr><th>Person</th><th>Role</th><th>Access</th><th class="n">Seat days</th><th class="n">Used days</th><th class="n">Adoption</th></tr>' +
      rows.map(r => '<tr><td>' + esc(r.email || r.user_id) + (r.is_active ? '' : ' <span style="color:var(--text3)">(removed)</span>') + '</td><td>' + esc(r.role || '') + '</td><td>' +
        (r.periods || []).map(p => fmtD(p.from) + ' to ' + fmtD(p.to)).join(', ') + '</td><td class="n">' + r.seat_days + '</td><td class="n">' + r.used_days +
        '</td><td class="n">' + (r.seat_days ? pct(Math.min(r.used_days, r.seat_days), r.seat_days) + '%<span class="us-bar"><i style="width:' + pct(Math.min(r.used_days, r.seat_days), r.seat_days) + '%"></i></span>' : '') + '</td></tr>').join('') +
      '</table></div>' : '<div class="empty">Nobody had access in this month.</div>') +
    '<div style="font-size:11px;color:var(--text3);margin-top:10px;line-height:1.5">Days are India time. A person removed and restored has two periods, and the gap is not counted. Used days are recorded from 1 October 2026, when tracking began.</div>';
}
function usageCsv(){
  if (!_usage) return;
  const rows = [['Organisation', 'Month', 'Person', 'Role', 'Access now', 'Periods', 'Seat days', 'Days in month', 'Seat share', 'Used days']];
  (_usage.users || []).forEach(r => rows.push([_usage._org, _usage.month, r.email || r.user_id, r.role || '', r.is_active ? 'Active' : 'Removed',
    (r.periods || []).map(p => p.from + ' to ' + (p.to || 'now')).join('; '), r.seat_days, _usage.days_in_month,
    (r.seat_days / _usage.days_in_month).toFixed(4), r.used_days]));
  const csv = rows.map(r => r.map(v => { const t = String(v == null ? '' : v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'SamoraOS-usage-' + String(_usage._org).replace(/[^A-Za-z0-9]+/g, '-') + '-' + _usage.month + '.csv';

// Stored as "Label | goal" lines because that is what an admin can edit in
// ten seconds without a row builder, and parsed into the JSON the app reads.
function _renderGoalTemplates(kv){
  const el = $('goal-templates'); if (!el) return;
  let list = [];
  try { list = JSON.parse(kv.campaign_goal_templates || '[]'); } catch(_e) { list = []; }
  el.value = (Array.isArray(list) ? list : []).map(function(t){ return (t.label||'') + ' | ' + (t.goal||''); }).join('\n');
}
async function saveGoalTemplates(orgId){
  const el = $('goal-templates'), msg = $('goal-templates-msg');
  const list = String(el && el.value || '').split('\n').map(function(line){
    const i = line.indexOf('|');
    if (i < 0) { const g = line.trim(); return g ? { label: g.slice(0, 40), goal: g } : null; }
    const label = line.slice(0, i).trim(), goal = line.slice(i + 1).trim();
    return (label && goal) ? { label: label, goal: goal } : null;
  }).filter(Boolean);
  if (msg) { msg.textContent = 'Saving…'; msg.style.color = 'var(--text3)'; }
  const d = await edgeCall('admin_set_org_kv', { org_id: orgId, key: 'campaign_goal_templates', value: JSON.stringify(list) });
  if (msg) {
    if (d && d.ok) { msg.textContent = list.length + ' template' + (list.length===1?'':'s') + ' saved'; msg.style.color = 'var(--green, #4a7)'; }
    else { msg.textContent = 'Error: ' + ((d && d.error) || 'admin_set_org_kv not available'); msg.style.color = 'var(--coral)'; }
  }
}

function _mergeNR(saved){
  var base=JSON.parse(JSON.stringify(NR_DEFAULTS));
  if(!saved||typeof saved!=='object')return base;

  if(saved.quiet_hours)Object.assign(base.quiet_hours,saved.quiet_hours);
  if(saved.weekly_digest)Object.assign(base.weekly_digest,saved.weekly_digest);

async function saveOrgPolicy(orgId){
  setSaveStatus('Saving…','');

    nr.quiet_hours={enabled:$('nr-quiet')?.checked,start:parseInt($('nr-quiet-start')?.value||'21',10),end:parseInt($('nr-quiet-end')?.value||'8',10)};
    nr.weekly_digest={enabled:$('nr-digest')?.checked,day:parseInt($('nr-digest-day')?.value||'1',10),hour:parseInt($('nr-digest-hour')?.value||'8',10)};
    NR_META.forEach(function(m){ var rc={enabled:$('nr-rule-'+m.key)?.checked}; m.params.forEach(function(p){ var el=$('nr-'+m.key+'-'+p.key); rc[p.key]=el?(parseInt(el.value,10)||0):p.def; }); nr.rules[m.key]=rc; });

  setSaveStatus('Saving…','');
  // Start from what the org ALREADY has, then overlay only the toggles this
  // panel actually rendered. A flag added by a future release, or set directly
  // in SQL, survives a save from an older panel instead of being silently
  // deleted by it.
  const features = Object.assign({}, (window.__orgFeatures || {}));
  FEATURE_FLAGS.forEach(k=>{
    const t=$('flag-'+k); if(t) features[k]=t.classList.contains('on');
  });
  const stageInputs=document.querySelectorAll('#stage-list .stage-input');
  const deal_stages=Array.from(stageInputs).map((inp,i)=>({key:inp.dataset.key||'stage_'+i,label:inp.value.trim()||'Stage '+(i+1),color:''})).filter(st=>st.label);
  const streamRows=document.querySelectorAll('#stream-type-list .stage-row');
  const revenue_stream_types=Array.from(streamRows).map((row,i)=>{
    const inp=row.querySelector('input');const sel=row.querySelector('select');
    return {key:inp?.dataset.key||'stream_'+i,label:inp?.value.trim()||'Stream '+(i+1),type:sel?.value||'MRR'};
  }).filter(s=>s.label);
  const role_labels={};
  ['sdr','ae','manager','director'].forEach(r=>{const el=$('cfg-role-'+r);if(el)role_labels[r]=el.value.trim()||r.toUpperCase()});
  const settings={email_provider:$('cfg-email')?.value,ai_engine:$('cfg-ai')?.value,deal_stages,revenue_stream_types,features,role_labels,stale_days:parseInt($('cfg-stale')?.value)||10,unanswered_days:parseInt($('cfg-unans')?.value)||3,lookback_days:parseInt($('cfg-lookback')?.value)||90};
  const aiKey=$('cfg-ai-key')?.value;if(aiKey)settings.ai_api_key=aiKey;
  const ntProvider=$('cfg-nt-provider')?.value||null;
  settings.notetaker_provider=ntProvider||null;
  const ntKey=$('cfg-nt-key')?.value;if(ntKey)settings.notetaker_api_key=ntKey;
  const seqProvider=$('cfg-seq-provider')?.value||null;
  settings.sequencing_provider=seqProvider||null;
  const seqKey=$('cfg-seq-key')?.value;if(seqKey)settings.sequencing_api_key=seqKey;
  const seqTeam=$('cfg-seq-team')?.value;if(seqTeam)settings.sequencing_team_id=seqTeam;
  const icpIndustries=($('icp-industries')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const icpGeos=($('icp-geos')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const icpStakeholders=($('icp-stakeholders')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const icpKeywords=($('icp-keywords')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const icpSize=$('icp-size')?.value||'';
  const icpDealSize=parseFloat($('icp-deal-size')?.value)||null;
  const icpUseCase=$('icp-use-case')?.value||'';
  // The guard used to be (industries || geos || useCase), so filling in ONLY
  // target stakeholders, or only keywords, or only company size, silently
  // dropped the whole ICP: it was never added to the payload, nothing was
  // sent, and the page still said "Saved" because the request itself
  // succeeded. It then vanished on refresh.
  //
  // That is exactly the shape a services or events business fills in first:
  // they know WHO they sell to long before they can name an industry.
  const icpHasAnything = icpIndustries.length || icpGeos.length || icpStakeholders.length
    || icpKeywords.length || !!icpUseCase || !!icpSize || icpDealSize !== null;
  if(icpHasAnything){
    settings.icp_definition={target_industries:icpIndustries,target_geographies:icpGeos,target_stakeholders:icpStakeholders,target_company_size:icpSize,ideal_deal_size_usd:icpDealSize,ideal_use_case:icpUseCase,keywords:icpKeywords};
  }
  const gId=$('cfg-g-id')?.value;if(gId)settings.google_client_id=gId;
  const gSec=$('cfg-g-secret')?.value;if(gSec)settings.google_client_secret=gSec;
  const d=await edgeCall('upsert_org_settings',{org_id:orgId,settings});
  if(d.ok){setSaveStatus('Saved','ok');loadOrgs()}
  else{setSaveStatus('Error: '+(d.error||'unknown'),'err')}
}

// Sheet names are the contract between export and import, so they live in one
// map rather than being typed twice.

// home: products and users to their tables, competitors to org_competitors,
// ICP and revenue streams to the wide org_settings row, thresholds and
// notification rules to org_kv.
const XL_IMPORTABLE = ['users','products','competitors','company_info','thresholds','notification_rules','revenue_streams'];

function _xlMsg(text, ok){ const m=$('xl-msg'); if(m){ m.textContent=text; m.className='msg'+(ok?' ok':''); } }

  { 'Competitor Name':'Zoho',               'Aliases':'Zoho CRM',                  'Domain':'zoho.com',               'Category':'CRM', 'Notes':'Example row, edit or delete', 'Active':'Yes' },
  { 'Competitor Name':'Microsoft Dynamics', 'Aliases':'MS Dynamics; Dynamics 365', 'Domain':'dynamics.microsoft.com', 'Category':'CRM', 'Notes':'Use the full name, not "dynamics"', 'Active':'Yes' }
];

// Revenue stream types Samora understands. Same closed-list logic as Role:
// the system reasons about these four, so they are a dropdown rather than
// free text, whatever an org calls the stream itself in the Label column.

// Shown when an org has none yet. Deliberately generic product categories

  { 'Product Name':'CRM',                    'Category':'Core',     'Description':'Example row, edit or delete', 'Keywords':'pipeline; contacts; forecasting' },
  { 'Product Name':'Procurement Management', 'Category':'Add-on',   'Description':'Example row, edit or delete', 'Keywords':'sourcing; vendors; purchase orders' }
];

// The Label is what a rep sees; the Stream key is the internal identifier.

  { 'Stream':'product_name_3', 'Label':'Example: quarterly support',         'Type':'QRR',      'Active':'Yes' }
];

// Example column on Company Info, so an admin filling this in for the first
// time can see the expected shape and separator rather than guessing.
const XL_COMPANY_EXAMPLES = {
  'Ideal Use Case':      'Field sales execution and retail visibility for enterprise FMCG brands',
  'Target Industries':   'FMCG; CPG; Food & Beverage; Personal Care',
  'Target Geographies':  'India; Middle East; Southeast Asia',

async function downloadOrgWorkbook(orgId){
  const btn=$('xl-dl-btn'); if(btn){btn.disabled=true;btn.textContent='Preparing…';}
  try{
    // org_id is required: a platform admin manages several client orgs and
    // picks one in the sidebar. Without it the export silently returns the
    // ADMIN'S own org, which looks like real data for the wrong company.
    const d=await edgeCall('admin_export_config',{org_id:orgId});
    if(!d||!d.ok){ _xlMsg('Export failed: '+((d&&d.error)||'admin_export_config action not available')); return; }

    const wb=new ExcelJS.Workbook();
    wb.creator='Samora Admin';
    wb.created=new Date();
    let n=0;

    (d.sheet_order||Object.keys(XL_SHEETS)).forEach(function(key){
      let rows=d[key];
      if(!Array.isArray(rows)) return;

      // Company Info gains an Example column the export does not send.
      if(key==='company_info'){
        rows=rows.map(function(r){ return { Field:r.Field, Value:r.Value, Example:XL_COMPANY_EXAMPLES[r.Field]||'' }; });
      }
      // Examples only when the org has nothing of its own, so the sheet is
      // self-explanatory instead of an empty grid. Never mixed in alongside
      // real data, where they would look like real rows.
      if(key==='competitors'      && !rows.length) rows=XL_COMPETITOR_EXAMPLES;
      if(key==='products'         && !rows.length) rows=XL_PRODUCT_EXAMPLES;
      if(key==='revenue_streams'  && !rows.length) rows=XL_STREAM_EXAMPLES;

      _xlAddSheet(wb, key, XL_SHEETS[key]||key, rows);
      n++;
    });

    const org=(orgs.find(function(o){return o.org_id===orgId;})||{});
    const safe=String(org.display_name||org.name||'org').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='samora-setup-'+safe+'-'+new Date().toISOString().slice(0,10)+'.xlsx';
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
    _xlMsg('Downloaded '+n+' sheets. Edit and upload the same file to apply changes.', true);
  }catch(e){ _xlMsg('Export failed: '+e.message); }
  finally{ if(btn){btn.disabled=false;btn.textContent='Download setup';} }
}

// One styled sheet: black header band with gold bold text, frozen so it stays
// visible while scrolling, plus a real Role dropdown on the Users sheet.
function _xlAddSheet(wb, key, sheetName, rows){
  const headers=_xlHeadersFor(key);
  const ws=wb.addWorksheet(sheetName);
  ws.columns=headers.map(function(h){ return { header:h, key:h, width:Math.max(14, Math.min(48, h.length+12)) }; });

  rows.forEach(function(r){
    const o={}; headers.forEach(function(h){ o[h]=(r[h]!==undefined&&r[h]!==null)?r[h]:''; });
    ws.addRow(o);
  });

  const hr=ws.getRow(1);
  hr.height=20;
  hr.eachCell(function(cell){
    cell.fill={ type:'pattern', pattern:'solid', fgColor:{ argb:XL_HDR_BG } };
    cell.font={ bold:true, color:{ argb:XL_HDR_FG }, size:11 };
    cell.alignment={ vertical:'middle', horizontal:'left' };
    cell.border={ bottom:{ style:'thin', color:{ argb:'FF3A3830' } } };
  });
  ws.views=[{ state:'frozen', ySplit:1 }];

  // Closed-list dropdowns. Applied well past the current row count so rows
  // the admin adds or pastes inherit them too, and rejected at entry rather
  // than failing later at import time.
  const listCol=function(headerName, options, title, help){
    const col=headers.indexOf(headerName)+1;
    if(col<1) return;
    const letter=ws.getColumn(col).letter;
    for(let r=2;r<=500;r++){
      ws.getCell(letter+r).dataValidation={
        type:'list', allowBlank:true,
        formulae:['"'+options.join(',')+'"'],
        showErrorMessage:true, errorStyle:'error',
        errorTitle:title, error:help
      };
    }
  };

  if(key==='users'){
    listCol('Role', XL_ROLE_OPTIONS, 'Invalid role',
      'Pick one of: '+XL_ROLE_OPTIONS.join(', ')+'. Your own internal job titles go in Full Name, not here.');
  }

  if(key==='revenue_streams'){
    // Same reasoning as Role: Samora reasons about these four types, so they
    // are a closed list. What the org CALLS the stream is free text in Label.
    listCol('Type', XL_STREAM_TYPES, 'Invalid stream type',
      'Pick one of: '+XL_STREAM_TYPES.join(', ')+'. Your own name for the stream goes in Label.');
  }

  // Health weights must total exactly 100, the same rule saveOrgPolicy
  // enforces in the app. In a spreadsheet that rule is invisible until an
  // import fails, so it is made visible here: each value is constrained to
  // 0-100, and a live TOTAL row shows the sum as it is edited.
  if(key==='thresholds' && rows.length){
    const vcol=headers.indexOf('Value')+1;
    if(vcol>0){
      const letter=ws.getColumn(vcol).letter;
      const first=2, last=rows.length+1;
      for(let r=first;r<=last;r++){
        ws.getCell(letter+r).dataValidation={
          type:'whole', operator:'between', formulae:[0,100], allowBlank:false,
          showErrorMessage:true, errorStyle:'error',
          errorTitle:'Out of range',
          error:'Each weight is 0 to 100, and all five must add up to exactly 100.'
        };
      }
      const totalRow=ws.addRow({});
      totalRow.getCell(1).value='TOTAL (must equal 100)';
      totalRow.getCell(vcol).value={ formula:'SUM('+letter+first+':'+letter+last+')' };
      totalRow.getCell(1).font={ bold:true };
      totalRow.getCell(vcol).font={ bold:true };
      // Turns red the moment the sum is anything other than 100, so the
      // admin sees the problem while editing rather than on upload.
      ws.addConditionalFormatting({
        ref: letter+totalRow.number+':'+letter+totalRow.number,
        rules: [{
          type:'cellIs', operator:'notEqual', formulae:['100'], priority:1,
          style:{ font:{ color:{ argb:'FFC0523F' }, bold:true } }
        }]
      });
    }
  }
  return ws;
}

// Headers for each sheet. Must match what admin_export_config emits when rows
// exist, or a round trip breaks.
function _xlHeadersFor(key){
  return ({
    users:['Email','Full Name','Phone','Role','Manager Email','Active','Assigned Accounts'],
    products:['Product Name','Category','Description','Keywords'],
    competitors:['Competitor Name','Aliases','Domain','Category','Notes','Active'],
    company_info:['Field','Value','Example'],
    thresholds:['Setting','Value','Unit'],
    notification_rules:['Rule','Enabled','Min Value (K)','Days'],
    revenue_streams:['Stream','Label','Type','Active']
  })[key]||['Field','Value'];
}
function handleWorkbookUpload(ev, orgId){
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const parsed={};
      XL_IMPORTABLE.forEach(function(key){
        const name=XL_SHEETS[key];
        if(wb.SheetNames.indexOf(name)<0) return;
        parsed[key]=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''})
          .filter(function(r){ return Object.keys(r).some(function(k){ return String(r[k]||'').trim()!==''; }); });
      });
      showImportPreview(parsed, orgId, wb.SheetNames);
    }catch(err){ _xlMsg('Could not read that file: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
// Nothing is written until the admin sees exactly what will happen. The
// preview is a real dry run against the edge action, not a second copy of the
// validation rules that could drift from the real one.
async function showImportPreview(parsed, orgId, sheetNames){
  window._xlPending = { parsed: parsed, orgId: orgId };
  $('modal-root').innerHTML='<div class="modal-bg"><div class="modal">'+
    '<h3>Checking the file</h3><div class="card-sub">Nothing has been changed yet.</div></div></div>';

  let d;
  try{ d = await edgeCall('admin_bulk_import', { org_id: orgId, sheets: parsed, dry_run: true }); }
  catch(e){ d = { ok:false, error:e.message }; }

  if(!d || !d.ok){
    $('modal-root').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+
      '<h3>Could not read that file</h3>'+
      '<div style="font-size:12px;color:var(--coral);margin-top:8px">'+esc((d&&d.error)||'admin_bulk_import action not available. Deploy admin_bulk_import_patch.ts first.')+'</div>'+
      '<div style="margin-top:16px"><button class="btn btn-outline" onclick="closeModal()">Close</button></div></div></div>';
    return;
  }

  const res = d.results || [];
  const bad = res.filter(function(r){ return r.Result === 'Invalid'; });
  const good = res.filter(function(r){ return r.Result === 'Will import'; });

  // One line per sheet, counting only what will actually be written.
  const bySheet = {};
  good.forEach(function(r){ bySheet[r.Sheet] = (bySheet[r.Sheet]||0) + 1; });
  const counts = Object.keys(bySheet).map(function(sh){
    return '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>'+esc(sh)+'</span><strong>'+bySheet[sh]+' row'+(bySheet[sh]===1?'':'s')+'</strong></div>';
  }).join('') || '<div style="color:var(--text3)">Nothing in this file will be imported.</div>';

  const errHtml = bad.length
    ? '<div style="margin-top:10px;font-size:12px;color:var(--coral)"><strong>'+bad.length+' row'+(bad.length===1?'':'s')+' will be skipped:</strong>'+
      '<div style="max-height:120px;overflow:auto;margin-top:4px">'+bad.map(function(x){ return '<div>'+esc(x.Sheet+' '+x.Item+': '+x.Detail)+'</div>'; }).join('')+'</div></div>'
    : '';

  $('modal-root').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<h3>Review before applying</h3>'+
    '<div class="card-sub">Nothing has been changed yet. This is what the upload will do.</div>'+
    '<div style="margin-top:10px;font-size:13px">'+counts+'</div>'+errHtml+
    '<div style="margin-top:10px;font-size:11px;color:var(--text3)">New users get a generated temporary password. You can download those once, on the results screen.</div>'+
    '<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button class="btn" id="xl-apply-btn" onclick="applyImport()">Apply '+good.length+' rows</button>'+
      '<button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>'+
    '<div class="msg" id="xl-apply-msg"></div></div></div>';
}

// One call. The edge action owns ordering (reference data before users) and
// reports a row per item, so nothing here needs to know the write order.
async function applyImport(){
  const p = window._xlPending; if(!p) return;
  const btn = $('xl-apply-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Applying…'; }
  const m = $('xl-apply-msg'); if(m){ m.textContent = 'Writing. Do not close this window.'; m.className = 'msg ok'; }

  let d;
  try{ d = await edgeCall('admin_bulk_import', { org_id: p.orgId, sheets: p.parsed }); }
  catch(e){ d = { ok:false, error:e.message }; }

  if(!d || !d.ok){
    if(m){ m.textContent = 'Error: ' + ((d&&d.error)||'unknown'); m.className = 'msg'; }
    if(btn){ btn.disabled = false; btn.textContent = 'Retry'; }
    return;
  }
  showImportResults(d.results || [], p.orgId);
}
function showImportResults(results, orgId){
  const ok=results.filter(function(r){return r.Result==='Created'||r.Result==='Created/updated'||r.Result==='Updated'||r.Result==='Saved';}).length;
  const failed=results.filter(function(r){return r.Result==='Failed';}).length;
  const skipped=results.filter(function(r){return r.Result==='Skipped';}).length;
  window._xlResults=results;
  $('modal-root').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<h3>Import complete</h3>'+
    '<div style="font-size:13px;margin-top:8px">'+ok+' applied, '+skipped+' skipped, '+failed+' failed.</div>'+
    (failed?'<div style="font-size:12px;color:var(--coral);margin-top:6px">Failed rows are listed in the results file. Fix and re-upload just those.</div>':'')+
    '<div style="font-size:11px;color:var(--text3);margin-top:10px">The results file contains temporary passwords for new users. Download it now, share them, then delete it.</div>'+
    '<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button class="btn" onclick="downloadImportResults()">Download results</button>'+
      '<button class="btn btn-outline" onclick="closeModal();selectOrg(\''+orgId+'\')">Done</button></div></div></div>';
}
function downloadImportResults(){
  const rows=window._xlResults||[];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Results');
  XLSX.writeFile(wb,'samora-import-results-'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function _parsePeopleLines(text, defRole){
  const roles=['sdr','ae','member','manager','director','executive','admin'];
  return String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.split(/[,\t;]/).map(x=>x.trim()).filter(x=>x!=='');
    const email=(parts.find(p=>/@/.test(p))||'').toLowerCase();
    const role=(parts.find(p=>roles.includes(p.toLowerCase()))||defRole).toLowerCase();
    const name=parts.filter(p=>p.toLowerCase()!==email && !roles.includes(p.toLowerCase())).join(' ')||null;
    return { email, name, role, raw:l };
  });
}

  });

}

// One component, two homes: the customer's admin inside SamoraOS (their own
// org) and Samora's admin panel (any org). Same edge actions behind both, so
// the two can never disagree about who reports to whom or who sees what.
//
// It renders ONLY what org_admin_get returns: people, reporting lines, shares,
// seats and the activity log. There is deliberately nothing here about
// scoring, signals, providers or settings.
//
// mount(el, { call(action, body) -> json, orgId?: string, onChange?: fn })
// ═══════════════════════════════════════════════════════════════════════════
(function () {
  'use strict';

  // The org's own names for roles (org_settings.role_labels, edited in Samora
  // admin) replace these defaults wherever a role is shown or picked.
  var ROLE_DEFAULT = { sdr: 'SDR', ae: 'AE', manager: 'Manager', director: 'Director', executive: 'Executive',
                     member: 'Member (old role)', admin: 'Admin (old role)', super_admin: 'Account owner' };
  function applyRoleLabels(map) {
    Object.keys(ROLE_LABEL).forEach(function (k) { delete ROLE_LABEL[k]; });
    Object.keys(ROLE_DEFAULT).forEach(function (k) { ROLE_LABEL[k] = ROLE_DEFAULT[k]; });
    if (!map || typeof map !== 'object') return;
    ['sdr', 'ae', 'manager', 'director', 'executive'].forEach(function (k) {
      var v = map[k]; if (typeof v === 'string' && v.trim()) ROLE_LABEL[k] = v.trim().slice(0, 40);
    });
    if (typeof map.member === 'string' && map.member.trim()) ROLE_LABEL.member = map.member.trim().slice(0, 40) + ' (old role)';
  }
  var ROLE_LABEL = { sdr: 'SDR', ae: 'AE', manager: 'Manager', director: 'Director', executive: 'Executive',
                     member: 'Member (old role)', admin: 'Admin (old role)', super_admin: 'Account owner' };
  var WHY_LABEL = { self: 'Themselves', org: 'Whole organisation', team: 'In their team', shared: 'Shared', shared_team: 'Shared, with team' };

  function h(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function initials(p) {
    var src = (p.name || p.email || '?').replace(/@.*/, '');
    var parts = src.split(/[\s._-]+/).filter(Boolean);
    return ((parts[0] || '?')[0] + ((parts[1] || '')[0] || '')).toUpperCase();
  }
  function who(p) { return p ? (p.name || p.email) : 'Unknown'; }
  function fmtWhen(iso) {
    try { return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }

  function Console(el, opts) {

    this.tab = 'people';

    this.query = '';
    this.accessFor = null;
    this.collapsed = {};
    var self = this;
    el.addEventListener('click', function (e) { self._click(e); });
    el.addEventListener('change', function (e) { self._change(e); });
    el.addEventListener('input', function (e) {
      if (e.target && e.target.getAttribute('data-sxa') === 'search') { self.query = e.target.value.toLowerCase(); self._renderBody(); }
    });
  }

  Console.prototype._body = function (extra) {
    var b = extra || {};
    if (this.orgId) b.org_id = this.orgId;

  };

  Console.prototype.load = async function () {

  // Hosted blocks are moved INTO the console while their tab is open and

  Console.prototype._under = function (rootId) {

  Console.prototype._people = function () {

  // ── Reporting lines ────────────────────────────────────────────────────
  Console.prototype._tree = function () {
    var people = this.data.people.filter(function (p) { return p.is_active; });
    var byId = this.byId, self = this;
    var kids = {};

      var m = p.manager_id && byId[p.manager_id] && byId[p.manager_id].is_active ? p.manager_id : null;
      (kids[m || '_root'] = kids[m || '_root'] || []).push(p);
    });
    var rank = { executive: 0, super_admin: 0, admin: 1, director: 2, manager: 3, ae: 4, sdr: 5, member: 6 };
    var sort = function (a) { return a.sort(function (x, y) { return ((rank[x.role] || 9) - (rank[y.role] || 9)) || who(x).localeCompare(who(y)); }); };
    var count = function (id) { return Object.keys(self._under(id)).length; };
    var node = function (p, depth) {

      return '<li class="sxa-node">' +
        '<div class="sxa-card' + (orphan ? ' sxa-card-warn' : '') + '">' +
          (ch.length ? '<button class="sxa-tw" data-sxa="fold" data-id="' + p.user_id + '" aria-label="' + (open ? 'Collapse' : 'Expand') + '">' + (open ? '▾' : '▸') + '</button>' : '<span class="sxa-tw sxa-tw-x"></span>') +
          '<span class="sxa-av sxa-av-s">' + h(initials(p)) + '</span>' +
          '<div class="sxa-pw"><div class="sxa-pn">' + h(who(p)) + (p.is_org_admin ? ' <span class="sxa-badge">Admin</span>' : '') + '</div>' +
          '<div class="sxa-pe">' + h(ROLE_LABEL[p.role] || p.role) + (ch.length ? ' · ' + count(p.user_id) + ' in team' : '') + (orphan ? ' · their manager was removed' : '') + '</div></div>' +
          '<select class="sxa-sel sxa-sel-s" data-sxa="mgr" data-id="' + p.user_id + '" aria-label="Move ' + h(who(p)) + '">' + self._managerOptions(p) + '</select>' +
        '</div>' +
        (ch.length && open ? '<ul class="sxa-ul">' + ch.map(function (c) { return node(c, depth + 1); }).join('') + '</ul>' : '') +
      '</li>';

    var unplaced = roots.filter(function (p) { return leaders.indexOf(p) === -1; });

      (leaders.length ? '<ul class="sxa-ul sxa-ul-root">' + leaders.map(function (p) { return node(p, 0); }).join('') + '</ul>' : '') +

  // ── Data access ────────────────────────────────────────────────────────
  Console.prototype._access = function () {
    var d = this.data, byId = this.byId, self = this;

    var seesRemoved = Object.keys(acc.sees).filter(function (id) { return id !== pid && byId[id] && !byId[id].is_active; }).length;
    var seenBy = active.filter(function (v) { return v.user_id !== pid && d.access[v.user_id] && d.access[v.user_id].sees[pid]; });
    var chip = function (why) { return '<span class="sxa-why sxa-why-' + why + '">' + h(WHY_LABEL[why] || why) + '</span>'; };
    var li = function (p, why) { return '<li><span class="sxa-av sxa-av-s">' + h(initials(p)) + '</span><span class="sxa-li-n">' + h(who(p)) + (p.is_active ? '' : ' <span class="sxa-muted">(removed)</span>') + '</span>' + chip(why) + '</li>'; };

        return '<option value="' + p.user_id + '"' + (p.user_id === sel ? ' selected' : '') + '>' + h(who(p)) + ' · ' + h(ROLE_LABEL[p.role] || p.role) + '</option>';

      '<div class="sxa-acc-pick"><span class="sxa-lbl">Person</span>' + pick('acc-person', pid, null) + '<div class="sxa-note">' + h(tierLine) + '</div></div>' +
      '<div class="sxa-acc-cols">' +
        '<div class="sxa-acc-col"><div class="sxa-sec">Can see (' + sees.length + ')</div>' +
          (sees.length ? '<ul class="sxa-acc-ul">' + sees.sort(function (a, b) { return who(byId[a]).localeCompare(who(byId[b])); }).map(function (id) { return li(byId[id], acc.sees[id]); }).join('') + '</ul>' : '<div class="sxa-empty sxa-empty-s">Only their own work.</div>') +
          (seesRemoved ? '<div class="sxa-note" style="margin-top:6px">Plus the past work of ' + seesRemoved + ' removed ' + (seesRemoved === 1 ? 'login' : 'logins') + '.</div>' : '') +
        '</div>' +

          (seenBy.length ? '<ul class="sxa-acc-ul">' + seenBy.map(function (v) { return li(v, d.access[v.user_id].sees[pid]); }).join('') + '</ul>' : '<div class="sxa-empty sxa-empty-s">Nobody else yet.</div>') +
        '</div>' +
      '</div>' +
      '<div class="sxa-share">' +
        '<div class="sxa-sec">Share access</div>' +
        '<div class="sxa-share-row"><span>Let</span>' + pick('sh-viewer', pid, null) + '<span>also see</span>' + pick('sh-subject', firstOther ? firstOther.user_id : null, null) +
          '<label class="sxa-inl"><input type="checkbox" data-sxa="sh-team" checked/> and everyone under them</label>' +

        (shares.length ? '<ul class="sxa-acc-ul sxa-shares">' + shares.map(function (g) {
          return '<li><span class="sxa-li-n">' + h(who(byId[g.viewer_user_id])) + ' <span class="sxa-muted">sees</span> ' + h(who(byId[g.subject_user_id])) + (g.include_team ? ' <span class="sxa-muted">and their team</span>' : '') + '</span>' +
            '<button class="sxa-btn sxa-btn-ghost" data-sxa="unshare" data-v="' + g.viewer_user_id + '" data-s="' + g.subject_user_id + '">Remove</button></li>';
        }).join('') + '</ul>' : '<div class="sxa-note">No extra shares. Everyone sees what their role and reporting line give them.</div>') +
      '</div>' +
    '</div>';

  // ── Activity ───────────────────────────────────────────────────────────
  Console.prototype._loadLog = async function () {

    var said = function (e) {
      var x = e.detail || {}, t = h(e.target_email || 'someone'), parts = [];

      if (e.action === 'person_restored') return 'restored ' + t;
      if (e.action === 'person_removed') return 'removed ' + t + (x.reports_moved_up ? ' (' + x.reports_moved_up + ' moved up to their manager)' : '');
      if (e.action === 'access_shared') return 'let ' + t + ' see ' + h(x.subject_email || '') + (x.include_team ? ' and their team' : '');
      if (e.action === 'access_removed') return 'stopped ' + t + ' seeing ' + h(x.subject_email || '');

      if (e.action === 'product_updated') return 'updated the product ' + h(x.product || '');
      if (e.action === 'product_removed') return 'removed the product ' + h(x.product || '');
      if (e.action === 'icp_updated') return 'updated the ideal customer profile' + (x.fields && x.fields.indexOf('target_stakeholders') !== -1 ? ', including target designations' : '');
      if (e.action === 'test_data_removed') return 'removed test data for ' + t + (x.summary ? ': ' + h(x.summary) : '');
      if (e.action === 'accounts_exported') return 'downloaded the account list (' + (x.count || 0) + ' accounts)';
      if (e.action === 'accounts_imported') return 'uploaded accounts: ' + (x.added || 0) + ' added, ' + (x.updated || 0) + ' updated' + (x.failed ? ', ' + x.failed + ' could not be saved' : '');
      if (x.role) parts.push('role ' + h(ROLE_LABEL[x.role.from] || x.role.from || 'none') + ' to ' + h(ROLE_LABEL[x.role.to] || x.role.to));

  // ── events ─────────────────────────────────────────────────────────────
